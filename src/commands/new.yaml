name: new
description: Create a new chapter change
category: workflow
parameters:
  - name: id
    type: string
    required: true
    description: Unique change identifier (e.g., ch-012)
steps:
  - action: cli
    command: openadab new chapter {{id}}
  - action: read
    paths: "adab/changes/{{id}}/.openadab.yaml"
